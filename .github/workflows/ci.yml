name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Match the release toolchain: the project uses Xcode 26-era Swift
          # (nonisolated deinit, SWIFT_DEFAULT_ACTOR_ISOLATION) that Xcode 16.x
          # either rejects or silently ignores.
          xcode-version: '26.1.1'

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Fetch yt-dlp
        run: ./scripts/fetch-ytdlp.sh

      - name: Build and test
        run: |
          xcodebuild \
            -project ClipHack.xcodeproj \
            -scheme ClipHack \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test
