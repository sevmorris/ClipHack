name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-26 because a build that passes on 15 can still fail on 26: FFmpeg
    # binaries without LC_UUID abort at launch under macOS 26.7's dyld, and a
    # macos-15 job stays green. The integration tests exec the bundled ffmpeg
    # and yt-dlp, so that class of failure turns this leg red.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Latest Xcode on the macos-15 image (build 17C529), and on
          # macos-26 too. The project needs Xcode 26-era Swift (nonisolated
          # deinit, SWIFT_DEFAULT_ACTOR_ISOLATION) that 16.x rejects; 26.1.1
          # hung launching the GUI test host on the runner, 26.3 does not.
          xcode-version: '26.3'

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Fetch yt-dlp
        run: ./scripts/fetch-ytdlp.sh

      - name: Build and test
        # Hard cap so a wedged test-host launch fails in minutes instead of
        # burning the full job budget. A healthy run finishes in ~3 min; no
        # test starting means -test-timeout flags wouldn't fire, so bound the
        # whole step instead.
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project ClipHack.xcodeproj \
            -scheme ClipHack \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test
