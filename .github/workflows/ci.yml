name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-26 because a build that passes on 15 can still fail on 26: FFmpeg
    # binaries without LC_UUID abort at launch under macOS 26.7's dyld, and a
    # macos-15 job stays green. The integration tests exec the bundled ffmpeg
    # and yt-dlp, so that class of failure turns this leg red.
    #
    # xcode-27 because releases are built with Xcode 27 on the owner's Mac, and
    # the 26.3 legs never compile what ships: the macOS 27 SDK and Swift 6.4.
    # Its image is macOS 27, the OS users move to next. GitHub calls it a public
    # preview, with no uptime promise.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '26.3'
          - os: macos-26
            xcode: '26.3'
          - os: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 26.3 on macos-15 and macos-26 (build 17C529). The project needs
          # Xcode 26-era Swift (nonisolated deinit, SWIFT_DEFAULT_ACTOR_ISOLATION)
          # that 16.x rejects; 26.1.1 hung launching the GUI test host on the
          # runner, 26.3 does not. The xcode-27 leg runs 27.0, the release
          # toolchain.
          xcode-version: ${{ matrix.xcode }}

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Fetch yt-dlp
        run: ./scripts/fetch-ytdlp.sh

      - name: Build and test
        # Hard cap so a wedged test-host launch fails in minutes instead of
        # burning the full job budget. A healthy run finishes in ~3 min; no
        # test starting means -test-timeout flags wouldn't fire, so bound the
        # whole step instead.
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project ClipHack.xcodeproj \
            -scheme ClipHack \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test
